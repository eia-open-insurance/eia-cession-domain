server:
  port: 8092
spring:
  application:
    name: eia-cession-domain
eia:
  cession:
    expert-url: http://localhost:8091
  fsri:
    base-url: http://localhost:8181
    cession-path: /sim/fsri/v1/cessions
    connect-timeout: 2s
    read-timeout: 5s
management:
  endpoints:
    web:
      exposure:
        include: health,info
